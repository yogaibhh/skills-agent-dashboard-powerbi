name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-pwsh:
    name: tests on PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          ./tests/run-tests.ps1

  test-windows-powershell:
    name: tests on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          ./tests/run-tests.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber
          }
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning
          $findings | Format-Table -AutoSize Severity, RuleName, Line, ScriptName, Message
          $errorCount = @($findings | Where-Object { $_.Severity -eq 'Error' }).Count
          Write-Host "$errorCount analyzer error(s)"
          if ($errorCount -gt 0) {
            throw "PSScriptAnalyzer reported $errorCount error(s)."
          }

  example:
    name: committed example still validates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and render the example
        shell: pwsh
        run: |
          $scripts = './plugins/powerbi-dashboard/skills/powerbi-dashboard/scripts'
          $report = './examples/sales-overview/Sales Overview.Report'
          $model = './examples/sales-overview/Sales.SemanticModel'
          & "$scripts/validate-pbir.ps1" -ReportPath $report -ModelPath $model -FailOnWarning
          & "$scripts/preview-pbir.ps1" -ReportPath $report -OutputPath "$env:RUNNER_TEMP/preview.html"

  mcp-node-20:
    name: MCP server on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install
        working-directory: mcp
        run: npm ci
      - name: Typecheck, build and test
        working-directory: mcp
        run: npm test

  mcp-node-22:
    name: MCP server on Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install
        working-directory: mcp
        run: npm ci
      - name: Typecheck, build and test
        working-directory: mcp
        run: npm test
