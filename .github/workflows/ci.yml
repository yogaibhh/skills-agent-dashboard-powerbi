name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The scripts claim support for both PowerShell editions, so both get exercised.
    # 'pwsh' is PowerShell 7, 'powershell' is Windows PowerShell 5.1.
    name: tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4

      - name: Show version
        shell: ${{ matrix.shell }}
        run: $PSVersionTable | Format-List

      - name: Run test suite
        shell: ${{ matrix.shell }}
        run: ./tests/run-tests.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyze
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber
          }
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning

          $errors = @($findings | Where-Object Severity -eq 'Error')
          $warnings = @($findings | Where-Object Severity -eq 'Warning')

          foreach ($f in $findings) {
            "{0}: {1} ({2}:{3}) {4}" -f $f.Severity, $f.RuleName, (Resolve-Path -Relative $f.ScriptPath), $f.Line, $f.Message
          }

          "`n$($errors.Count) error(s), $($warnings.Count) warning(s)."
          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($errors.Count) error(s)."
          }

  example:
    name: example still validates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The committed example doubles as a fixture. If a script change breaks it, this catches it
      # even if someone edits the example rather than the scripts.
      - name: Validate committed example
        shell: pwsh
        run: |
          ./plugins/powerbi-dashboard/skills/powerbi-dashboard/scripts/validate-pbir.ps1 `
            -ReportPath "./examples/sales-overview/Sales Overview.Report" `
            -ModelPath  "./examples/sales-overview/Sales.SemanticModel" `
            -FailOnWarning

      - name: Regenerate preview and confirm it is unchanged
        shell: pwsh
        run: |
          ./plugins/powerbi-dashboard/skills/powerbi-dashboard/scripts/preview-pbir.ps1 `
            -ReportPath "./examples/sales-overview/Sales Overview.Report" `
            -OutputPath "./examples/sales-overview/preview.html" | Out-Null

          # The generated file carries a timestamp, so compare everything except that line.
          $diff = git diff --numstat -- "examples/sales-overview/preview.html"
          if ($diff) {
            $changed = git diff -U0 -- "examples/sales-overview/preview.html" |
                       Where-Object { $_ -match '^[+-][^+-]' -and $_ -notmatch 'generated \d{4}-\d{2}-\d{2}' }
            if ($changed) {
              "Committed preview.html is stale. Regenerate it and commit the result:"
              $changed
              exit 1
            }
          }
          "preview.html is up to date."
